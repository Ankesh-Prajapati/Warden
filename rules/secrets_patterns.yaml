# Warden — Default Secrets Rule Pack
# Format inspired by gitleaks/trufflehog. Each rule:
#   id: unique short id
#   description: human readable name (used in report)
#   regex: Python regex (case-insensitive unless noted)
#   severity: Critical | High | Medium | Low
#   tags: freeform list for filtering/grouping
#
# Users can extend this file or add additional *.yaml files under rules/
# and load them via --rules-dir.

rules:
  # ---------------------------------------------------------------
  # Cloud provider credentials
  # ---------------------------------------------------------------
  - id: aws-access-key-id
    description: "AWS Access Key ID"
    regex: '\b(AKIA|ABIA|ACCA|ASIA)[0-9A-Z]{16}\b'
    severity: Critical
    tags: [cloud, aws]

  - id: aws-secret-access-key
    description: "AWS Secret Access Key (context: aws + 40-char base64-ish)"
    regex: '(?i)aws(.{0,20})?(secret|access)?[_-]?key[^=:]{0,3}[:=]\s*["'']?[A-Za-z0-9/+=]{40}["'']?'
    severity: Critical
    tags: [cloud, aws]

  - id: azure-storage-key
    description: "Azure Storage Account Key"
    regex: '(?i)AccountKey=[A-Za-z0-9+/=]{60,}'
    severity: Critical
    tags: [cloud, azure]

  - id: azure-sas-token
    description: "Azure SAS Token"
    regex: '(?i)sig=[A-Za-z0-9%]{20,}'
    severity: High
    tags: [cloud, azure]

  - id: gcp-api-key
    description: "Google Cloud API Key"
    regex: '\bAIza[0-9A-Za-z\-_]{35}\b'
    severity: Critical
    tags: [cloud, gcp]

  - id: gcp-service-account-json
    description: "GCP Service Account private key block"
    regex: '"type"\s*:\s*"service_account"'
    severity: Critical
    tags: [cloud, gcp]

  # ---------------------------------------------------------------
  # Generic tokens / auth
  # ---------------------------------------------------------------
  - id: jwt-token
    description: "JSON Web Token (JWT)"
    regex: '\bey[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}\b'
    severity: High
    tags: [token, jwt]

  - id: bearer-token
    description: "Hardcoded Bearer token"
    regex: '(?i)bearer\s+[A-Za-z0-9\-_\.=]{20,}'
    severity: High
    tags: [token]

  - id: generic-api-key
    description: "Generic API key/secret assignment"
    regex: '(?i)(api[_-]?key|apikey|secret[_-]?key|client[_-]?secret)[^=:\n]{0,5}[:=]\s*["'']?[A-Za-z0-9\-_/+=]{16,}["'']?'
    severity: High
    tags: [generic]

  - id: generic-password-assignment
    description: "Hardcoded password assignment"
    regex: '(?i)(password|passwd|pwd)[^=:\n]{0,5}[:=]\s*["'']?[^\s"'']{6,}["'']?'
    severity: High
    tags: [credential]

  - id: slack-token
    description: "Slack Token"
    regex: '\bxox[baprs]-[0-9A-Za-z-]{10,}\b'
    severity: High
    tags: [saas, slack]

  - id: github-token
    description: "GitHub Token (PAT/OAuth/App)"
    regex: '\b(ghp|gho|ghu|ghs|ghr)_[A-Za-z0-9]{36}\b'
    severity: Critical
    tags: [saas, github]

  - id: stripe-key
    description: "Stripe API Key"
    regex: '\b(sk|rk)_(live|test)_[0-9A-Za-z]{24,}\b'
    severity: Critical
    tags: [saas, stripe]

  # ---------------------------------------------------------------
  # Database / connection strings
  # ---------------------------------------------------------------
  - id: db-connection-string-sqlserver
    description: "SQL Server connection string with embedded credentials"
    regex: '(?i)(Server|Data Source)\s*=\s*[^;]+;.*(Password|Pwd)\s*=\s*[^;]+;'
    severity: Critical
    tags: [database]

  - id: db-connection-string-generic-uri
    description: "Database URI with embedded credentials"
    regex: '(?i)\b(mongodb(\+srv)?|postgres(ql)?|mysql|redis|amqp|jdbc:[a-z]+)://[^\s"'':/]+:[^\s"''@]+@[^\s"'']+'
    severity: Critical
    tags: [database]

  - id: odbc-pwd
    description: "ODBC/OLEDB connection string password"
    regex: '(?i)\bPWD\s*=\s*[^;"''\s]{4,}'
    severity: High
    tags: [database]

  # ---------------------------------------------------------------
  # Private keys / certs
  # ---------------------------------------------------------------
  - id: pem-private-key
    description: "PEM-format private key block"
    regex: '-----BEGIN\s?(RSA|EC|DSA|OPENSSH|PGP)?\s?PRIVATE KEY-----'
    severity: Critical
    tags: [crypto, pem]

  - id: pkcs12-password
    description: "PFX/PKCS12 password reference"
    regex: '(?i)(pfx|p12)[_-]?password[^=:\n]{0,5}[:=]\s*["'']?[^\s"'']{4,}["'']?'
    severity: High
    tags: [crypto]

  # ---------------------------------------------------------------
  # Internal infra leakage
  # ---------------------------------------------------------------
  - id: internal-url
    description: "Internal/staging hostname or URL"
    regex: '(?i)https?://[a-z0-9.\-]*\.(internal|corp|local|staging|dev|test|uat)\b[^\s"'']*'
    severity: Medium
    tags: [infra, recon]

  - id: hardcoded-ip
    description: "Hardcoded IPv4 address"
    regex: '\b(?:(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\.){3}(?:25[0-5]|2[0-4][0-9]|[01]?[0-9][0-9]?)\b'
    severity: Low
    tags: [infra, recon]

  - id: connection-string-config-key
    description: "connectionString / ConnectionStrings config key with value"
    regex: '(?i)connectionstring[s]?["'']?\s*[:=]\s*["''][^"'']{10,}["'']'
    severity: High
    tags: [database, config]

  # ---------------------------------------------------------------
  # License / session tokens
  # ---------------------------------------------------------------
  - id: license-key-assignment
    description: "Hardcoded license/activation key"
    regex: '(?i)(license[_-]?key|activation[_-]?code)[^=:\n]{0,5}[:=]\s*["'']?[A-Za-z0-9\-]{10,}["'']?'
    severity: Medium
    tags: [license]

  - id: session-token-assignment
    description: "Hardcoded session/auth token"
    regex: '(?i)(session[_-]?token|auth[_-]?token)[^=:\n]{0,5}[:=]\s*["'']?[A-Za-z0-9\-_\.=]{16,}["'']?'
    severity: High
    tags: [session]
