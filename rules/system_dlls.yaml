# Warden — Known Windows System DLL Reference
#
# Used by Module 2 (DLL Hijacking Detection) to distinguish imports that
# would normally resolve from a real Windows System32 directory (safe,
# not plantable by a local attacker) from imports that resolve to
# neither System32 nor the application's own directory — a strong
# signal of a missing/phantom DLL that could be planted for hijacking.
#
# This list is intentionally conservative (common, well-known system
# DLLs across modern Windows versions). It is not exhaustive; unusual
# but legitimate system DLLs may be flagged as "unknown" rather than
# confidently "system" or "phantom" — see confidence handling in
# dll_hijack_module.py.

